name = "metric-monitor-api"
main = "src/index.ts"
compatibility_date = "2024-03-20"

# Scheduled Cron Triggers
[triggers]
crons = ["*/15 * * * *"] # Run every 15 minutes to evaluate trackers

# Cloudflare Queues for fan-out processing
[[queues.producers]]
queue = "ga4-monitor-queue"
binding = "MONITOR_QUEUE"

[[queues.consumers]]
queue = "ga4-monitor-queue"
max_batch_size = 10
max_retries = 3

# Cloudflare KV for caching GA4 responses and baselines
[[kv_namespaces]]
binding = "METRIC_CACHE"
id = "preview_id_only" # To be replaced with real ID upon creation
preview_id = "local_cache_preview"

# Environment Variables (Secrets should be set via `wrangler secret put`)
[vars]
# TURSO_URL = ""
# TURSO_AUTH_TOKEN = ""
# CLERK_PUBLISHABLE_KEY = ""
# CLERK_SECRET_KEY = ""
# RESEND_API_KEY = ""
